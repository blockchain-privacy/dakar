basePath: /api/v1
definitions:
  analytics.MixingActivity:
    properties:
      block:
        items:
          properties:
            ts:
              type: string
          type: object
        type: array
      input_txs:
        items:
          properties:
            txhash:
              type: string
          type: object
        type: array
      privacytype:
        type: integer
      txhash:
        type: string
    type: object
  attribution.FrontendAttribution:
    properties:
      address:
        type: string
      category:
        type: string
      description:
        type: string
      isPublic:
        type: boolean
      source:
        type: string
      tag:
        type: string
      ts:
        type: string
      uid:
        type: string
    type: object
  client.AuthenticatorAssuranceLevel:
    enum:
    - aal0
    - aal1
    - aal2
    - aal3
    type: string
    x-enum-varnames:
    - AUTHENTICATORASSURANCELEVEL_AAL0
    - AUTHENTICATORASSURANCELEVEL_AAL1
    - AUTHENTICATORASSURANCELEVEL_AAL2
    - AUTHENTICATORASSURANCELEVEL_AAL3
  client.Identity:
    properties:
      additionalProperties:
        additionalProperties: true
        type: object
      created_at:
        description: CreatedAt is a helper struct field for gobuffalo.pop.
        type: string
      credentials:
        additionalProperties:
          $ref: '#/definitions/client.IdentityCredentials'
        description: Credentials represents all credentials that can be used for authenticating
          this identity.
        type: object
      id:
        description: ID is the identity's unique identifier.  The Identity ID can
          not be changed and can not be chosen. This ensures future compatibility
          and optimization for distributed stores such as CockroachDB.
        type: string
      metadata_admin:
        description: NullJSONRawMessage represents a json.RawMessage that works well
          with JSON, SQL, and Swagger and is NULLable-
      metadata_public:
        description: NullJSONRawMessage represents a json.RawMessage that works well
          with JSON, SQL, and Swagger and is NULLable-
      recovery_addresses:
        description: RecoveryAddresses contains all the addresses that can be used
          to recover an identity.
        items:
          $ref: '#/definitions/client.RecoveryIdentityAddress'
        type: array
      schema_id:
        description: SchemaID is the ID of the JSON Schema to be used for validating
          the identity's traits.
        type: string
      schema_url:
        description: 'SchemaURL is the URL of the endpoint where the identity''s traits
          schema can be fetched from.  format: url'
        type: string
      state:
        $ref: '#/definitions/client.IdentityState'
      state_changed_at:
        type: string
      traits:
        description: Traits represent an identity's traits. The identity is able to
          create, modify, and delete traits in a self-service manner. The input will
          always be validated against the JSON Schema defined in `schema_url`.
      updated_at:
        description: UpdatedAt is a helper struct field for gobuffalo.pop.
        type: string
      verifiable_addresses:
        description: VerifiableAddresses contains all the addresses that can be verified
          by the user.
        items:
          $ref: '#/definitions/client.VerifiableIdentityAddress'
        type: array
    type: object
  client.IdentityCredentials:
    properties:
      additionalProperties:
        additionalProperties: true
        type: object
      config:
        additionalProperties: true
        type: object
      created_at:
        description: CreatedAt is a helper struct field for gobuffalo.pop.
        type: string
      identifiers:
        description: Identifiers represents a list of unique identifiers this credential
          type matches.
        items:
          type: string
        type: array
      type:
        $ref: '#/definitions/client.IdentityCredentialsType'
      updated_at:
        description: UpdatedAt is a helper struct field for gobuffalo.pop.
        type: string
      version:
        description: Version refers to the version of the credential. Useful when
          changing the config schema.
        type: integer
    type: object
  client.IdentityCredentialsType:
    enum:
    - password
    - totp
    - oidc
    - webauthn
    - lookup_secret
    type: string
    x-enum-varnames:
    - IDENTITYCREDENTIALSTYPE_PASSWORD
    - IDENTITYCREDENTIALSTYPE_TOTP
    - IDENTITYCREDENTIALSTYPE_OIDC
    - IDENTITYCREDENTIALSTYPE_WEBAUTHN
    - IDENTITYCREDENTIALSTYPE_LOOKUP_SECRET
  client.IdentityState:
    enum:
    - active
    - inactive
    type: string
    x-enum-varnames:
    - IDENTITYSTATE_ACTIVE
    - IDENTITYSTATE_INACTIVE
  client.RecoveryIdentityAddress:
    properties:
      additionalProperties:
        additionalProperties: true
        type: object
      created_at:
        description: CreatedAt is a helper struct field for gobuffalo.pop.
        type: string
      id:
        type: string
      updated_at:
        description: UpdatedAt is a helper struct field for gobuffalo.pop.
        type: string
      value:
        type: string
      via:
        type: string
    type: object
  client.Session:
    properties:
      active:
        description: Active state. If false the session is no longer active.
        type: boolean
      additionalProperties:
        additionalProperties: true
        type: object
      authenticated_at:
        description: The Session Authentication Timestamp  When this session was authenticated
          at. If multi-factor authentication was used this is the time when the last
          factor was authenticated (e.g. the TOTP code challenge was completed).
        type: string
      authentication_methods:
        description: A list of authenticators which were used to authenticate the
          session.
        items:
          $ref: '#/definitions/client.SessionAuthenticationMethod'
        type: array
      authenticator_assurance_level:
        $ref: '#/definitions/client.AuthenticatorAssuranceLevel'
      devices:
        description: Devices has history of all endpoints where the session was used
        items:
          $ref: '#/definitions/client.SessionDevice'
        type: array
      expires_at:
        description: The Session Expiry  When this session expires at.
        type: string
      id:
        description: Session ID
        type: string
      identity:
        $ref: '#/definitions/client.Identity'
      issued_at:
        description: The Session Issuance Timestamp  When this session was issued
          at. Usually equal or close to `authenticated_at`.
        type: string
    type: object
  client.SessionAuthenticationMethod:
    properties:
      aal:
        $ref: '#/definitions/client.AuthenticatorAssuranceLevel'
      additionalProperties:
        additionalProperties: true
        type: object
      completed_at:
        description: When the authentication challenge was completed.
        type: string
      method:
        type: string
      provider:
        description: OIDC or SAML provider id used for authentication
        type: string
    type: object
  client.SessionDevice:
    properties:
      additionalProperties:
        additionalProperties: true
        type: object
      id:
        description: Device record ID
        type: string
      ip_address:
        description: IPAddress of the client
        type: string
      location:
        description: Geo Location corresponding to the IP Address
        type: string
      user_agent:
        description: UserAgent of the client
        type: string
    type: object
  client.VerifiableIdentityAddress:
    properties:
      additionalProperties:
        additionalProperties: true
        type: object
      created_at:
        description: When this entry was created
        type: string
      id:
        description: The ID
        type: string
      status:
        description: VerifiableAddressStatus must not exceed 16 characters as that
          is the limitation in the SQL Schema
        type: string
      updated_at:
        description: When this entry was last updated
        type: string
      value:
        description: The address value  example foo@user.com
        type: string
      verified:
        description: Indicates if the address has already been verified
        type: boolean
      verified_at:
        type: string
      via:
        description: VerifiableAddressType must not exceed 16 characters as that is
          the limitation in the SQL Schema
        type: string
    type: object
  clustering.Attribution:
