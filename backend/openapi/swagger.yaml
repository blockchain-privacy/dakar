host: localhost
info:
  contact: {}
  description: This is the REST API for Dakar
  title: Dakar API
  version: 1.0.4
paths:
  /addAddressExclusions/:
    post:
      parameters:
      - description: the CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.msgReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.msgReply'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.msgReply'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.msgReply'
      summary: Adds new address exclusions for the current user
      tags:
      - address exclusions
  /addCluster/:
    post:
      parameters:
      - description: separator of the CSV file; only comma and semicolon are allowed.
        in: formData
        name: separator
        required: true
        type: string
      - description: controls whether the first line should be skiped
        in: formData
        name: hasHeader
        required: true
        type: boolean
      - description: the CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.msgReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.msgReply'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.msgReply'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.msgReply'
      summary: Add Cluster
      tags:
      - cluster
  /addPrivateAttribution/:
    post:
      parameters:
      - description: separator of the CSV file
        in: formData
        name: separator
        required: true
        type: string
      - description: controls whether the first line should be skiped
        in: formData
        name: hasHeader
        required: true
        type: boolean
      - description: the CSV file
        in: formData
        name: file
        required: true
        type: file
      produces:
      - text/csv
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/server.msgReply'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/server.msgReply'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/server.msgReply'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/server.msgReply'
      summary: Create a new attribution which is only visible for the current user
      tags:
      - attribution
  /addPublicAttribution/:
    post:
      parameters:
      - description: separator of the CSV file
        in: formData
        name: separator
        required: true
        type: string
      - description: controls whether the first line should be skiped
        in: formData
        name: hasHeader
        required: true
        type: boolean
      - description: the CSV file
        in: formData
        name: file
        required: true
