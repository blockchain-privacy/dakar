# credits: https://about.gitlab.com/blog/2017/11/27/go-tools-and-gitlab-how-to-do-continuous-integration-like-a-boss/
image: golang:latest

default:
  tags:
    - main

variables:
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/vendor/go

.modcache: &modcache
  key: modcache
  paths:
    - vendor/go/pkg/mod/

dependencies:
  stage: dependencies
  script:
    - cd ../..
    - go mod download
    - go get -v -d ./...
  cache: *modcache


stages:
  - dependencies
  - test
  - build

before_script:
  - cat /etc/hosts
  - cd backend/cmd/crawler

unit_tests:
  stage: test
  needs: ["dependencies"]
  variables:
    CI_ACTIVE: "1" # variable to recognize that tests are run via the CI, any non-empty value works
  script:
    - export WORKDIR=$PWD
    - mkdir -p $GOPATH/src/github.com/btcsuite
    - cd $GOPATH/src/github.com/btcsuite
    - git clone https://github.com/btcsuite/btcd
    - cd btcd
    - go install -v . ./cmd/...
    - export PATH=$PATH:$GOPATH/bin
    - cd $WORKDIR
    - make test
  services:
    - name: dgraph/standalone:v21.03.2
      alias: dgraph_db # database for db module
    - name: dgraph/standalone:v21.03.2
      alias: dgraph_status # database for status module
    - name: dgraph/standalone:v21.03.2
      alias: dgraph_user # database for user module
    - name: dgraph/standalone:v21.03.2
      alias: dgraph_processor # database for processor module
    - name: dgraph/standalone:v21.03.2
      alias: dgraph_analytics # database for classifier module

  cache:
    <<: *modcache
    policy: pull

lint_code:
  stage: test
  needs: ["dependencies"]
  script: make lint
  cache:
    <<: *modcache
    policy: pull

vet:
  stage: test
  needs: ["dependencies"]
  script: make vet
  cache:
    <<: *modcache
    policy: pull

build:
  stage: build
  script: make
  cache:
    <<: *modcache
    policy: pull

