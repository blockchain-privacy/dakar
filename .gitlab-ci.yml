# credits: https://about.gitlab.com/blog/2017/11/27/go-tools-and-gitlab-how-to-do-continuous-integration-like-a-boss/
image: golang:latest

default:
  tags:
    - main

variables:
  GOPATH: ${CI_PROJECT_DIR}/vendor/go
  DGRAPH_VERSION: v23.1.0
  BTCD_VERSION: v0.23.3

.modcache: &modcache
  key: modcache
  paths:
    - vendor/go/pkg/mod/

dependencies:
  stage: dependencies
  script:
    - go mod download
    - go get -v -d ./...
  cache: *modcache

stages:
  - dependencies
  - test
  - build

before_script:
  - cd backend

test:
  stage: test
  needs: ["dependencies"]
  variables:
    CI_ACTIVE: "1" # variable to recognize that tests are run via the CI, any non-empty value works
  script:
    # get btcd for rpc testing
    - curl --fail --silent --show-error -LO https://github.com/btcsuite/btcd/releases/download/$BTCD_VERSION/btcd-linux-amd64-$BTCD_VERSION.tar.gz
    - tar -xvzf btcd-linux-amd64-$BTCD_VERSION.tar.gz
    - mv btcd-linux-amd64-$BTCD_VERSION/btcd /bin/btcd
    # start tests
    - make test
  services:
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_db # database for db module
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_status # database for status module
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_user # database for user module
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_processor # database for processor module
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_analytics # database for classifier module

  cache:
    <<: *modcache
    policy: pull

lint:
  stage: test
  needs: ["dependencies"]
  script: make lint
  cache:
    <<: *modcache
    policy: pull

vet:
  stage: test
  needs: ["dependencies"]
  script: make vet
  cache:
    <<: *modcache
    policy: pull

build:
  stage: build
  script: make
  cache:
    <<: *modcache
    policy: pull

