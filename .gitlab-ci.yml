# credits: https://about.gitlab.com/blog/2017/11/27/go-tools-and-gitlab-how-to-do-continuous-integration-like-a-boss/
image: golang:latest

default:
  tags:
    - main

variables:
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/vendor/go

.modcache: &modcache
  key: modcache
  paths:
    - vendor/go/pkg/mod/

dependencies:
  stage: dependencies
  script:
    - cd ../..
    - go mod download
    - go get -v -d ./...
  cache: *modcache


stages:
  - dependencies
  - test
  - build

before_script:
  - df
  - cat /etc/resolv.conf
  - cat /etc/hosts
  - cd backend/cmd/crawler

unit_tests:
  stage: test
  image: golang:latest
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_DRIVER: overlay2
    YOUR_APP_DB_HOST: docker
  script:
    - cd ../..
    - go test -race ./...

lint_code:
  stage: test
  needs: ["dependencies"]
  script: make lint
  cache:
    <<: *modcache
    policy: pull

vet:
  stage: test
  needs: ["dependencies"]
  script: make vet
  cache:
    <<: *modcache
    policy: pull

build:
  stage: build
  script: make
  cache:
    <<: *modcache
    policy: pull

