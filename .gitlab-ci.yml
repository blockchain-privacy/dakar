#code_coverage:
#  stage: test
#  script:
#    - make coverage

#code_coverage_report:
#  stage: test
#  script:
#    - make coverhtml
#  only:
#  - master

lint_code:
  stage: test
  script: make lint
  cache:
    <<: *modcache
    policy: pull

build:
  stage: build
  script: make
  cache:
    <<: *modcache
    policy: pull
