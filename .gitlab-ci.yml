# credits: https://about.gitlab.com/blog/2017/11/27/go-tools-and-gitlab-how-to-do-continuous-integration-like-a-boss/
image: golang:latest

default:
  tags:
    - main

variables:
  GOFLAGS: -mod=readonly
  GOPATH: ${CI_PROJECT_DIR}/vendor/go
  GIT_SUBMODULE_STRATEGY: recursive

.modcache: &modcache
  key: modcache
  paths:
    - vendor/go/pkg/mod/

dependencies:
  stage: dependencies
  script:
    - cd ../..
    - go mod download
    - go get -v -d ./...
  cache: *modcache


stages:
  - dependencies
  - test
  - build

before_script:
  - cd backend/cmd/crawler

unit_tests:
  stage: test
  script: make test
  cache:
    <<: *modcache
    policy: pull

race_detector:
  stage: test
  script: make race
  cache:
    <<: *modcache
    policy: pull

#memory_sanitizer:
