# credits: https://about.gitlab.com/blog/2017/11/27/go-tools-and-gitlab-how-to-do-continuous-integration-like-a-boss/
image: golang:latest

default:
  tags:
    - main

variables:
  GOPATH: ${CI_PROJECT_DIR}/vendor/go
  DGRAPH_VERSION: v23.1.0
  BTCD_VERSION: v0.23.3
  SWAGGO_VERSION: 1.16.2

.modcache: &modcache
  key: modcache
  paths:
    - vendor/go/pkg/mod/

dependencies:
  stage: dependencies
  script:
    - go mod download
    - go get -v -d ./...
  cache: *modcache

stages:
  - dependencies
  - test
  - build

before_script:
  - cd backend

test:
  stage: test
  needs: [ "dependencies" ]
  variables:
    DB_TESTS: "1" # variable which controls if tests requiring the database should be run
    RPC_TESTS: "1" # variable which controls if tests requiring the RPC-client should be run
    DB_HOSTNAME: "dgraph_db" # name of the dgraph database container
  script:
    # get btcd for rpc testing
    - curl --fail --silent --show-error -LO https://github.com/btcsuite/btcd/releases/download/$BTCD_VERSION/btcd-linux-amd64-$BTCD_VERSION.tar.gz
    - tar -xvzf btcd-linux-amd64-$BTCD_VERSION.tar.gz
    - mv btcd-linux-amd64-$BTCD_VERSION/btcd /bin/btcd
    # start tests
    - make test
  services:
    - name: dgraph/standalone:$DGRAPH_VERSION
      alias: dgraph_db # database for db module
  cache:
    <<: *modcache
    policy: pull

lint:
  image: golangci/golangci-lint:latest
  stage: test
  script: make lint

vet:
  stage: test
  needs: [ "dependencies" ]
  script: make vet
  cache:
    <<: *modcache
    policy: pull

build:
  stage: build
  script: make
  cache:
    <<: *modcache
    policy: pull

swaggo:
  stage: build
  script:
    - curl --fail --silent --show-error -LO https://github.com/swaggo/swag/releases/download/v"${SWAGGO_VERSION}"/swag_"${SWAGGO_VERSION}"_Linux_x86_64.tar.gz
    - tar -xvzf swag_"${SWAGGO_VERSION}"_Linux_x86_64.tar.gz
    - make swagger-fmt
    - make swagger-create
  artifacts:
    paths:
      - backend/openapi

