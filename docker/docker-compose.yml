version: "3.6"
services:

  zero:
    image: dgraph/dgraph:v21.03.2
    container_name: zero
    volumes:
      - ${DGRAPH_PATH}:/dgraph
    ports:
      - "${CONTAINER_IP}:5080:5080"
      - "${CONTAINER_IP}:6080:6080"
    restart: unless-stopped
    command: dgraph zero --my=zero:5080 --telemetry "reports=false; sentry=false"
    networks:
      - dgraph_default

  alpha:
    image: dgraph/dgraph:v21.03.2
    container_name: alpha
    volumes:
      - ${DGRAPH_PATH}:/dgraph
    ports:
      - "${CONTAINER_IP}:8080:8080"
      - "${CONTAINER_IP}:9080:9080"
    expose:
      - 9080
    restart: unless-stopped
    command: dgraph alpha --my=alpha:7080 --zero=zero:5080 --security "whitelist=192.168.188.0:192.168.188.255,172.16.0.0:172.31.255.255" --limit "query-edge=10000000" --telemetry "reports=false; sentry=false"
    networks:
      - dgraph_default

  ratel:
    image: dgraph/ratel:latest
    container_name: ratel
    ports:
      - "${CONTAINER_IP}:8000:8000"
    expose:
      - 8000
    command: dgraph-ratel

  kratos:
    container_name: kratos
    image: oryd/kratos:v0.10.1
    ports:
      - '4433:4433' # public
      - '4434:4434' # admin
    environment:
      - DSN=sqlite:///var/lib/sqlite/db.sqlite?_fk=true
      - LOG_LEVEL=trace
    command: serve -c /etc/config/kratos/kratos.yml --dev --watch-courier
#    command: migrate sql -e
    volumes:
      - type: volume
        source: kratos-sqlite
        target: /var/lib/sqlite
        read_only: false
      - type: bind
        source: ./kratos
        target: /etc/config/kratos
    networks:
      - dgraph_default

  mailslurper:
    container_name: mailslurper
    image: oryd/mailslurper:latest-smtps
    ports:
      - '4436:4436'
      - '4437:4437'
    networks:
      - dgraph_default

  dashd:
    image: dashpay/dashd:18.0
    container_name: dashd
    volumes:
      - ${DASH_PATH}:/dash
    ports:
      - "${CONTAINER_IP}:9999:9999"
      - "${CONTAINER_IP}:9998:9998"
    expose:
      - 9999
      - 9998
    command: dashd
    restart: unless-stopped

  wikiapi:
    image: bluedark/wikiapi:latest
    depends_on:
      - oathkeeper
    container_name: wikiapi
    command: -folder /data -linkPrefix /wiki/ -apiPrefix /wikiapi/
    volumes:
      - ./wikiapi_files:/data
    ports:
      - "4567:4567"
    expose:
      - 4567
    networks:
      - dgraph_default

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    depends_on:
      - kratos
    ports:
      - "4455:4455"
      - "4456:4456"
    command:
      serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml"
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    networks:
      - dgraph_default
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper

#  bitcoind:
#    image: ruimarinho/bitcoin-core:23.0-alpine
#    container_name: bitcoind
#    volumes:
#      - ${BITCOIN_PATH}:/home/bitcoin/.bitcoin
#    ports:
#      - "${CONTAINER_IP}:8332:8332"
#      - "${CONTAINER_IP}:8333:8333"
#    expose:
#      - 8332
#      - 8333
#    restart: unless-stopped

networks:
  dgraph_default:

volumes:
  kratos-sqlite:
