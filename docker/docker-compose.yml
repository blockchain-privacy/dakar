version: "3.6"
services:

  zero:
    image: dgraph/dgraph:v23.1.0
    container_name: zero
    volumes:
      - ${DGRAPH_PATH}:/dgraph
    ports:
      - "${CONTAINER_IP}:5080:5080"
      - "${CONTAINER_IP}:6080:6080"
    restart: unless-stopped
    command: dgraph zero --my=zero:5080 --telemetry "reports=false; sentry=false"
    networks:
      - dgraph_default

  alpha:
    image: dgraph/dgraph:v23.1.0
    container_name: alpha
    volumes:
      - ${DGRAPH_PATH}:/dgraph
    ports:
      - "${CONTAINER_IP}:8080:8080"
      - "${CONTAINER_IP}:9080:9080"
    expose:
      - 9080
    restart: unless-stopped
    command: dgraph alpha --my=alpha:7080 --zero=zero:5080 --security "whitelist=192.168.188.0:192.168.188.255,172.16.0.0:172.31.255.255" --limit "query-edge=10000000" --telemetry "reports=false; sentry=false"
    networks:
      - dgraph_default

  ratel:
    image: dgraph/ratel:latest
    container_name: ratel
    ports:
      - "${CONTAINER_IP}:8000:8000"
    expose:
      - 8000
    command: dgraph-ratel
    networks:
      - dgraph_default

  kratos:
    container_name: kratos
    image: oryd/kratos:v1.0
    ports:
      - '4433:4433' # public
      - '4434:4434' # admin
    user: "1000:1000"
    environment:
      - DSN=postgres://${KRATOS_POSTGRES_USER}:${KRATOS_POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4
      #- LOG_LEVEL=trace
      - SQA_OPT_OUT=true
      - SECRETS_COOKIE=${KRATOS_SECRETS_COOKIE}
      - SECRETS_CIPHER=${KRATOS_SECRETS_CIPHER}
    entrypoint: ''
    command: /bin/sh -c 'kratos serve -c /etc/config/kratos/kratos.yml --watch-courier ${KRATOS_DEV_CLI_PARAMETERS} 2>&1 | tee -a /etc/config/kratos/log.txt'
#    command: migrate sql -e # enable the three commands and run: sudo docker-compose run kratos
#    stdin_open: true # docker run -i
#    tty: true        # docker run -t
    volumes:
      - ./kratos:/etc/config/kratos
    networks:
      - dgraph_default

  postgres:
    container_name: postgres
    image: postgres:14.8
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${KRATOS_POSTGRES_USER}
      - POSTGRES_PASSWORD=${KRATOS_POSTGRES_PASSWORD}
      - POSTGRES_DB=kratos
    volumes:
      - ./kratos/sql:/var/lib/postgresql/data
    networks:
      - dgraph_default

  mailslurper:
    container_name: mailslurper
    image: oryd/mailslurper:latest-smtps
    ports:
      - '4436:4436'
      - '4437:4437'
    networks:
      - dgraph_default

  dashd:
    image: dashpay/dashd:19.3
    container_name: dashd
    volumes:
      - ${DASH_PATH}:/home/dash
    ports:
      - "${CONTAINER_IP}:9999:9999"
      - "${CONTAINER_IP}:9998:9998"
    expose:
      - 9999
      - 9998
    command: dashd
    restart: unless-stopped
    networks:
      - dgraph_default

  wikiapi:
    image: bluedark/wikiapi:latest
    depends_on:
      - oathkeeper
    container_name: wikiapi
    command: -folder /data -linkPrefix /wiki/ -apiPrefix /wikiapi/
    volumes:
      - ./wikiapi_files:/data
    ports:
      - "4567:4567"
    expose:
      - 4567
    networks:
      - dgraph_default

  oathkeeper:
    image: oryd/oathkeeper:v0.40
    depends_on:
      - kratos
    container_name: oathkeeper
    user: "1000:1000"
    ports:
      - "4455:4455"
      - "4456:4456"
    entrypoint: ''
    command: /bin/sh -c 'oathkeeper serve proxy -c "/etc/config/oathkeeper/oathkeeper.yml" --sqa-opt-out 2>&1 | tee -a /etc/config/oathkeeper/log.txt'
    environment:
      - LOG_LEVEL=debug
    restart: on-failure
    networks:
      - dgraph_default
    volumes:
      - ./oathkeeper:/etc/config/oathkeeper

  promtail:
    image: grafana/promtail:2.9.0
    container_name: promtail
    volumes:
      - ./promtail/promtail-local-config.yaml:/etc/promtail/config.yaml:ro
      - ./kratos/log.txt:/kratos_log.txt:ro
      - ./oathkeeper/log.txt:/oathkeeper_log.txt:ro
      - ../backend/cmd/crawler/crawler.log:/crawler.log:ro
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - dgraph_default

#  bitcoind:
#    image: ruimarinho/bitcoin-core:23.0-alpine
#    container_name: bitcoind
#    volumes:
#      - ${BITCOIN_PATH}:/home/bitcoin/.bitcoin
#    ports:
#      - "${CONTAINER_IP}:8332:8332"
#      - "${CONTAINER_IP}:8333:8333"
#    expose:
#      - 8332
#      - 8333
#    restart: unless-stopped

networks:
  dgraph_default:
