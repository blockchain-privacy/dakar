env:
  browser: true
  es6: true
extends:
  - 'plugin:vue/essential'
  - airbnb-base
globals:
  Atomics: readonly
  SharedArrayBuffer: readonly
  __COMMIT_HASH__: readonly
  __BRANCH__: readonly
parserOptions:
  ecmaVersion: 2018
  sourceType: module
plugins:
  - vue
rules: {
  no-param-reassign: [ error , { "props": false } ],
  no-mixed-operators: off
}
